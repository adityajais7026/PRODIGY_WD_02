<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A premium stopwatch web application with laps, fastest/slowest highlighting and timestamp-based accuracy. PWA-free, HTML5 + CSS3 + vanilla JavaScript." />
  <meta name="theme-color" content="#070a12" />
  <title>Stopwatch · Prodigy Infotech — Task 02</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated ambient background (decorative only) -->
  <div class="ambient" aria-hidden="true">
    <span class="ambient__blob ambient__blob--violet"></span>
    <span class="ambient__blob ambient__blob--blue"></span>
    <span class="ambient__blob ambient__blob--pink"></span>
  </div>

  <main class="app" id="app" data-status="ready">
    <header class="app__header">
      <p class="app__brand">Prodigy Infotech · Web Development · Task&nbsp;02</p>
      <h1 class="app__title">Stopwatch</h1>
    </header>

    <!-- Central stopwatch card -->
    <section class="card" aria-label="Stopwatch">
      <div class="card__statusbar">
        <span class="status">
          <span class="status__dot" aria-hidden="true"></span>
          <span class="status__text" id="statusText">Ready</span>
        </span>
      </div>

      <div class="timer" id="timer" role="timer" aria-label="Elapsed time">
        <span class="timer__digits" id="timerHh">00</span>
        <span class="timer__sep" aria-hidden="true">:</span>
        <span class="timer__digits" id="timerMm">00</span>
        <span class="timer__sep" aria-hidden="true">:</span>
        <span class="timer__digits" id="timerSs">00</span>
        <span class="timer__sep" aria-hidden="true">:</span>
        <span class="timer__digits timer__digits--ms" id="timerMs">000</span>
      </div>

      <div class="controls">
        <button type="button" class="btn btn--ghost" id="lapBtn" disabled>Lap</button>
        <button type="button" class="btn btn--primary" id="toggleBtn">
          <svg class="btn__icon btn__icon--play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M8 5.14v13.72c0 .84.93 1.35 1.64.9l10.5-6.86a1.07 1.07 0 0 0 0-1.8L9.64 4.24A1.07 1.07 0 0 0 8 5.14Z" />
          </svg>
          <svg class="btn__icon btn__icon--pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden>
            <path fill="currentColor" d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" />
          </svg>
          <span id="toggleLabel">Start</span>
        </button>
        <button type="button" class="btn btn--ghost" id="resetBtn" disabled>Reset</button>
      </div>
    </section>

    <!-- Lap history -->
    <section class="laps" aria-label="Lap history">
      <div class="laps__head" aria-hidden="true">
        <span>Lap</span>
        <span>Lap time</span>
        <span>Total</span>
      </div>
      <div class="laps__scroller" tabindex="0">
        <ol class="laps__list" id="lapsList"></ol>
        <p class="laps__empty" id="lapsEmpty">No laps recorded yet — press <em>Lap</em> while the timer runs.</p>
      </div>
    </section>

    <footer class="app__footer">
      <p><kbd>Space</kbd> start / pause / resume · <kbd>L</kbd> lap · <kbd>R</kbd> reset</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
